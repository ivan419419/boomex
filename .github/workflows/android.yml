name: Build Android APK

on:
  push:
    branches: [ principal, main ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Install Project Dependencies
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/android

    - name: Initialize Capacitor Configuration
      run: |
        npx cap init BOOMEX com.ivan419419.boomex --web-dir=www

    - name: Add and Sync Android Platform
      run: |
        npx cap add android
        npx cap sync

    - name: Fix Kotlin Duplicate Classes
      run: |
        cat >> android/app/build.gradle << 'EOF'

        configurations.all {
            exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
            exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
        }
        EOF

    - name: Build Android APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BOOMEX-Game-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk