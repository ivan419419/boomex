name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Permite que você clique em um botão para gerar o APK quando quiser

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses:   actions/setup-node@v4
      with:
        node-version: 20

    - name: Set up JDK 21
  uses: actions/setup-java@v4
  with:
    distribution: 'temurin'
    java-version: '21'

    - name: Install Project Dependencies
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/android

    - name: Initialize Capacitor Configuration
      run: |
        npx cap init BOOMEX com.ivan419419.boomex --web-dir=www

    - name: Add and Sync Android Platform
      run: |
        npx cap add android
        npx cap sync

    - name: Build Android APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BOOMEX-Game-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
